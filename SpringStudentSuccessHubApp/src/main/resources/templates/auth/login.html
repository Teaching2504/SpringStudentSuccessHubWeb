<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - OU-SSH Hub (Thymeleaf)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
        }
        .brand-icon {
            background: #1e3a8a;
            color: #ffffff;
            width: 4rem;
            height: 4rem;
            border-radius: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.3);
        }
        .btn-primary-custom {
            background-color: #1e3a8a;
            border-color: #1e3a8a;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            transition: all 0.2s;
        }
        .btn-primary-custom:hover {
            background-color: #172554;
            border-color: #172554;
            color: white;
        }
        .sample-btn {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            text-align: left;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.15s;
        }
        .sample-btn:hover {
            filter: brightness(0.95);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <!-- Header Brand -->
            <div class="mb-4">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="Logo Trường Đại học Mở TP.HCM"
                     class="mb-3" style="max-height: 95px; width: auto;">
                <h3 class="fw-bold text-dark mb-1">TRƯỜNG ĐẠI HỌC MỞ TP.HCM</h3>
                <h6 class="text-primary fw-semibold mb-1">CỔNG QUẢN TRỊ & CÁN BỘ (OU-SSH HUB - THYMELEAF)</h6>
                <small class="text-muted">Đề tài Đồ án tốt nghiệp - SV: Nguyễn Thị Tuyết Trinh (2351010216)</small>
            </div>

            <!-- Login Card -->
            <div class="login-card text-start mx-auto">
                <div class="d-flex align-items-center gap-2 mb-4 pb-3 border-bottom">
                    <i class="fa-solid fa-shield-halved text-primary fs-4"></i>
                    <h5 class="fw-bold mb-0 text-dark">Đăng nhập Cán bộ Quản trị</h5>
                </div>

                <!-- Error Message -->
                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/web/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Tên đăng nhập / Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" id="tenDangNhap" name="tenDangNhap" class="form-control" placeholder="Nhập tên đăng nhập" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" id="matKhau" name="matKhau" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng nhập hệ thống
                    </button>
                </form>

                <!-- Quick Test Login Buttons -->
                <div class="mt-4 pt-3 border-top">
                    <p class="text-muted small fw-bold text-uppercase mb-2" style="font-size: 0.7rem;">
                        Tài khoản mẫu thử nghiệm nhanh:
                    </p>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" onclick="fillFast('admin', 'admin123')" class="sample-btn w-100 bg-purple-subtle text-purple text-dark">
                                👑 <strong>Admin</strong>: admin
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" onclick="fillFast('captruong', 'truong123')" class="sample-btn w-100 bg-primary-subtle text-primary">
                                🏛️ <strong>Cấp Trường</strong>: captruong
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" onclick="fillFast('cbk_it', 'khoa123')" class="sample-btn w-100 bg-success-subtle text-success">
                                🏢 <strong>Khoa CNTT</strong>: cbk_it
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" onclick="fillFast('cbk_spe', 'khoa123')" class="sample-btn w-100 bg-warning-subtle text-warning">
                                🎓 <strong>Khoa ĐTĐB (CLC)</strong>: cbk_spe
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" onclick="fillFast('cbk_ba', 'khoa123')" class="sample-btn w-100 bg-info-subtle text-info">
                                💼 <strong>Khoa QTKD</strong>: cbk_ba
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" onclick="fillFast('cbk_acc', 'khoa123')" class="sample-btn w-100 bg-secondary-subtle text-secondary">
                                📊 <strong>Khoa KT-KT</strong>: cbk_acc
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="mt-4 text-muted small">
                © 2025 - 2026 Trường Đại học Mở Thành phố Hồ Chí Minh. Bảo lưu mọi quyền.
            </footer>
        </div>
    </div>
</div>

<script>
    function fillFast(u, p) {
        document.getElementById('tenDangNhap').value = u;
        document.getElementById('matKhau').value = p;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
