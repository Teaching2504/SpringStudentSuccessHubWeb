spring.application.name=SpringStudentSuccessHubApp
server.port=8080

# ===================================================================
# CẤU HÌNH KẾT NỐI MYSQL
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ousshdb?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ===================================================================
# HIBERNATE / JPA CẤU HÌNH CHO MYSQL (GIỮ NGUYÊN TÊN CỘT CAMELCASE)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ===================================================================
# CẤU HÌNH JWT BẢO MẬT
# ===================================================================
app.jwt.secret=9a3f694a737f272a8c3d82a1705e4d29f9c7a5494b8e2b3c1a8d6e9f0b2c4a6d
app.jwt.expiration-ms=86400000

# ===================================================================
# CẤU HÌNH UPLOAD FILE (TỐI ĐA 10MB)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads
